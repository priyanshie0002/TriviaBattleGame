<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Two-Player Trivia Battle</title>
	<link rel="stylesheet" href="BattleGame.css">
</head>

<body>
	<div id="mainContainer">
		<h1>Trivia Battle Game</h1>

		<div id="playerInputNames">
			<input type="text" class="inputBox" id="player1" placeholder="Enter Player 1 Name">
			<input type="text" class="inputBox" id="player2" placeholder="Enter Player 2 Name">
			<button onclick="startGame()">Start Game</button>
		</div>

		<div id="categorySelection">
			<h2>Select a Category</h2>
			<select id="categories"></select>
			<button onclick="fetchQuestions()">Start Quiz</button>
		</div>

		<div id="battleQuestion">
			<h2 id="currentPlayerTurn"></h2>
			<p id="questionTextBox"></p>
			<div id="answerTextBox"></div>
			<button onclick="nextTurn()" id="nextButton">Next</button>
		</div>

		<div id="scoreBoard">
			<h2>Scores</h2>
			<p id="score1"></p>
			<p id="score2"></p>
		</div>
	</div>

	<script src="BattleGame.js"></script>
</body>

</html>
